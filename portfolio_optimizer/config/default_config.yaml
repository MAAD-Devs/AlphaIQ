# portfolio_optimizer/config/default_config.yaml
# Centralized system configurations & defaults for Portfolio Optimizer

market_data:
  default_benchmark: "^GSPC"
  default_risk_free_rate_ticker: "^IRX"
  fallback_risk_free_rate: 0.04
  default_period: "5y"
  default_interval: "1d"
  cache_dir: ".cache/market_data"

macro:
  fred_api_key_env: "FRED_API_KEY"
  series:
    treasury_10y: "DGS10"
    treasury_2y: "DGS2"
    treasury_3m: "DGS3MO"
    inflation_10y_breakeven: "T10YIE"
    inflation_5y_breakeven: "T5YIE"
    cpi: "CPIAUCSL"
    fed_funds_rate: "FEDFUNDS"

analytics:
  risk_metrics:
    annualization_factor: 252  # Trading days per year
  tail_risk:
    var_confidence_level: 0.95
    cvar_confidence_level: 0.95
  factor_models:
    marcenko_pastur:
      bandwidth: 0.1
      spectral_shrinkage: true
  fixed_income:
    svf_params:
      beta0: 0.03
      beta1: -0.01
      beta2: 0.02
      beta3: 0.01
      tau1: 1.5
      tau2: 5.0
  annuities:
    default_simulations: 10000
    risk_free_discount: 0.04

optimization:
  solver: "CLARABEL"  # Solver choice for CVXPY / Riskfolio-Lib
  max_iterations: 1000
  target_return: null
  fee_drag_bps: 10  # 10 basis points transaction cost
  max_asset_weight: 0.35
  min_asset_weight: 0.0
