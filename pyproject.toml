[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_optimizer"
version = "0.1.0"
description = "Quantitative Portfolio Optimization and Risk Management Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "financetoolkit>=2.0.7",
    "fredapi>=0.5.2",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=1.40.1",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "riskfolio-lib>=5.0.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "yfinance>=0.2.35",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = false
